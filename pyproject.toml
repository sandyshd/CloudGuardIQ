[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguardiq"
version = "0.1.0"
description = "Azure-native CSPM + FinOps SaaS with AI remediation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-subscription>=3.1.1",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-mgmt-security>=6.0.0",
    "azure-mgmt-policyinsights>=1.0.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-mgmt-network>=25.0.0",
    "azure-mgmt-resourcegraph>=8.0.0",
    "openai>=1.35.0",
    "azure-servicebus>=7.12.0",
    "aiohttp>=3.9.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "stripe>=9.0.0",
    "reportlab>=4.2.0",
    "azure-storage-blob>=12.20.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
gcp = [
    "google-cloud-compute>=1.19.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-iam-admin>=0.1.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-functions>=1.16.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-spanner>=3.47.0",
    "google-cloud-redis>=2.15.0",
    "google-cloud-dns>=0.35.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-artifact-registry>=1.11.0",
    "google-cloud-container>=2.49.0",
    "google-cloud-kms>=2.24.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-api-python-client>=2.140.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "boto3>=1.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudguardiq*"]

[tool.setuptools.package-data]
"cloudguardiq.api.templates" = ["*.json"]

