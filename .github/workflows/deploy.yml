name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      component:
        description: "Which application(s) to deploy"
        required: true
        type: choice
        options:
          - all
          - frontend
          - backend
          - functions
        default: all

permissions:
  id-token: write
  contents: read

env:
  PREFIX: cguardiq
  ACR_NAME: cguardiq${{ github.event.inputs.environment }}acr

jobs:
  deploy-frontend:
    name: "Build & Deploy Frontend (${{ github.event.inputs.environment }})"
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'frontend' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_REDIRECT_URI: ${{ secrets.FRONTEND_URL }}
          VITE_API_BASE_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true

  deploy-backend:
    name: "Build & Deploy Backend (${{ github.event.inputs.environment }})"
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'backend' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/cloudguardiq:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Container App
        # Wrap ARM-touching commands in a retry: Azure Resource Manager
        # occasionally throttles (HTTP 429) when infra apply + deploy run
        # back-to-back. Five attempts with exponential backoff (2s -> 32s)
        # absorb transient throttling without masking real failures.
        run: |
          set -euo pipefail
          retry() {
            local n=1 max=5 delay=2
            while true; do
              if "$@"; then
                return 0
              fi
              if [ $n -ge $max ]; then
                echo "::error::Command failed after $n attempts: $*"
                return 1
              fi
              echo "::warning::Attempt $n/$max failed; retrying in ${delay}s..."
              sleep $delay
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry az containerapp registry set \
            --name ${{ env.PREFIX }}-${{ github.event.inputs.environment }}-api \
            --resource-group ${{ env.PREFIX }}-${{ github.event.inputs.environment }}-rg \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --identity system

          retry az containerapp update \
            --name ${{ env.PREFIX }}-${{ github.event.inputs.environment }}-api \
            --resource-group ${{ env.PREFIX }}-${{ github.event.inputs.environment }}-rg \
            --image ${{ env.ACR_NAME }}.azurecr.io/cloudguardiq:${{ github.sha }}

  deploy-functions:
    name: "Deploy Functions (${{ github.event.inputs.environment }})"
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'functions' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies into package
        run: |
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.PREFIX }}-${{ github.event.inputs.environment }}-func
          package: .
